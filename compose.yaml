services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: actions
      POSTGRES_USER: actions
      POSTGRES_PASSWORD: actions
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U actions"]
      interval: 5s
      timeout: 3s
      retries: 10
  temporal:
    image: temporalio/auto-setup:1.28.1
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: actions
      POSTGRES_PWD: actions
      POSTGRES_SEEDS: postgres
    ports: ["7233:7233"]
    depends_on:
      postgres:
        condition: service_healthy
