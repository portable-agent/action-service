spring:
  application:
    name: action-service
  jackson:
    datatype:
      datetime:
        adjust-dates-to-context-time-zone: false
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/actions}
    username: ${DATABASE_USER:actions}
    password: ${DATABASE_PASSWORD:actions}
  jooq:
    sql-dialect: POSTGRES
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8081/realms/portable-agent}
          audiences:
            - ${OIDC_AUDIENCE:action-service}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

temporal:
  target: ${TEMPORAL_TARGET:localhost:7233}
  namespace: ${TEMPORAL_NAMESPACE:default}
  task-queue: ${TEMPORAL_TASK_QUEUE:action-service}

mcp:
  gateway:
    enabled: ${MCP_GATEWAY_ENABLED:false}
    connect-timeout: ${MCP_GATEWAY_CONNECT_TIMEOUT:3s}
    read-timeout: ${MCP_GATEWAY_READ_TIMEOUT:10s}
